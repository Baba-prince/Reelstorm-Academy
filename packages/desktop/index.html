<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReelStorm Studio</title>
    <style>
      :root {
        --bg: #080808;
        --panel: #111;
        --line: rgba(255, 255, 255, 0.1);
        --orange: #ff7a00;
        --cyan: #00d9ff;
        --muted: rgba(255, 255, 255, 0.55);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: radial-gradient(ellipse at 20% 0%, rgba(124, 58, 237, 0.25), transparent 50%),
          radial-gradient(ellipse at 80% 20%, rgba(255, 122, 0, 0.15), transparent 45%), var(--bg);
        color: #fff;
        min-height: 100vh;
      }
      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }
      .brand {
        font-size: 11px;
        letter-spacing: 0.2em;
        color: var(--cyan);
        font-family: ui-monospace, monospace;
      }
      h1 {
        font-size: 42px;
        margin: 8px 0 6px;
        letter-spacing: -0.04em;
      }
      .sub {
        color: var(--muted);
        margin-bottom: 28px;
      }
      .card {
        border: 1px solid var(--line);
        background: rgba(17, 17, 17, 0.9);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input,
      textarea {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #0a0a0a;
        color: #fff;
        padding: 12px;
        margin-bottom: 12px;
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
      }
      .primary {
        background: var(--orange);
        color: #000;
      }
      .ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: #fff;
        margin-left: 8px;
      }
      .stat {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
      }
      .stat b {
        color: #fff;
      }
      .err {
        color: var(--orange);
        font-size: 13px;
        margin-top: 8px;
      }
      .ok {
        color: var(--cyan);
        font-size: 13px;
        margin-top: 8px;
      }
      .mono {
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">REELSTORM STUDIO · OPTION 2 · YOUR GPU · OUR MINUTES</div>
      <h1>Generate on your PC.</h1>
      <p class="sub">
        SkyReels V2 runs locally. Minutes are metered centrally — cancel Stripe and the app stops.
        License key is never stored after activation.
      </p>

      <div class="card" id="stats">
        <div class="stat">
          <div>Status: <b id="activated">—</b></div>
          <div>Key: <b class="mono" id="keyPrefix">—</b></div>
          <div>Remaining: <b id="remaining">—</b> / <span id="limit">—</span> min</div>
        </div>
      </div>

      <div class="card" id="activateCard">
        <h3 style="margin-top: 0">Activate license</h3>
        <label>Account email</label>
        <input id="email" type="email" placeholder="you@studio.com" />
        <label>License key (shown once after checkout)</label>
        <input id="key" type="password" placeholder="RSTUDIO-…" autocomplete="off" />
        <button class="primary" id="btnActivate">Activate on this PC</button>
        <button class="ghost" id="btnDash">Open dashboard</button>
        <div id="actMsg"></div>
      </div>

      <div class="card">
        <h3 style="margin-top: 0">Local generate</h3>
        <label>Prompt</label>
        <textarea id="prompt" rows="4" placeholder="Nollywood night market · slow dolly · neon rain"></textarea>
        <label>Duration (seconds)</label>
        <input id="dur" type="number" min="5" max="60" value="10" />
        <button class="primary" id="btnGen">Generate (report minutes)</button>
        <div id="genMsg"></div>
      </div>
    </div>
    <script type="module" src="/src/ui.ts"></script>
  </body>
</html>
